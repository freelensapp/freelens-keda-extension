# A ScaledJob that runs one Job at a time between minutes 0 and 10 of every
# hour. The cron scaler takes no credentials: the reference to example-auth is
# there for the links between the two.
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: example-job
  namespace: default
spec:
  jobTargetRef:
    backoffLimit: 0
    template:
      spec:
        containers:
        - name: sleep
          image: busybox:1.37
          command: [sleep, "60"]
        restartPolicy: Never
  pollingInterval: 30
  maxReplicaCount: 1
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  triggers:
  - type: cron
    metadata:
      timezone: America/Sao_Paulo
      start: 0 * * * *
      end: 10 * * * *
      desiredReplicas: "1"
    authenticationRef:
      name: example-auth
