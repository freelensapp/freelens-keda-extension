# The cluster-scoped test objects. Deleting the CRDs at the end of a session
# deletes them too. The ClusterTriggerAuthentication names a Secret in the
# namespace of the KEDA operator, which the session does not create, and no
# controller runs to send the events of the ClusterCloudEventSource.
apiVersion: keda.sh/v1alpha1
kind: ClusterTriggerAuthentication
metadata:
  name: test
spec:
  secretTargetRef:
  - parameter: connection
    name: test
    key: connection
---
apiVersion: eventing.keda.sh/v1alpha1
kind: ClusterCloudEventSource
metadata:
  name: test
spec:
  destination:
    http:
      uri: http://receiver.integration-tests:8080
